<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#E0EC8A">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    #site-header {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 48px);
      padding: clamp(24px, 3vw, 48px) clamp(24px, 3.5vw, 48px) clamp(16px, 2vw, 32px);
    }

    #logo-placeholder {
      flex-shrink: 0;
      width: clamp(64px, 9vw, 140px);
      height: clamp(64px, 9vw, 140px);
      border-radius: 50%;
      background: #C5FF30;
      display: block;
      overflow: hidden;
      text-decoration: none;
    }

    #headline {
      font-size: clamp(20px, 5.5vw, 88px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #000;
      margin: 0;
    }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(48px, 8vw, 120px) clamp(24px, 3.5vw, 48px);
      gap: clamp(16px, 2vw, 28px);
    }

    #error-code {
      font-size: clamp(96px, 20vw, 280px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: #C5FF30;
    }

    #error-msg {
      font-size: clamp(20px, 3vw, 44px);
      font-weight: 500;
      line-height: 1.2;
      color: #000;
    }

    #error-sub {
      font-size: clamp(14px, 1.2vw, 18px);
      color: rgba(0,0,0,0.45);
      line-height: 1.5;
    }

    #home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(8px, 1vw, 16px);
      font-size: clamp(15px, 1.2vw, 18px);
      font-weight: 500;
      color: #000;
      text-decoration: none;
      width: fit-content;
      position: relative;
    }

    #home-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: currentColor;
      transition: width 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (hover: hover) {
      #home-link:hover::after { width: 100%; }
    }

    /* ── FOOTER ── */
    #contact {
      border-top: 1px solid rgba(0,0,0,0.12);
      padding: clamp(32px, 5vw, 64px) clamp(24px, 3.5vw, 48px) clamp(48px, 7vw, 100px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: clamp(32px, 5vw, 64px);
    }

    .contact-left { flex: 1 1 auto; }

    .contact-tagline {
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 500;
      line-height: 1.3;
      color: #000;
      margin: 0;
    }

    .contact-linkedin {
      color: #000;
      text-decoration: none;
      position: relative;
    }

    .contact-linkedin::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 3px;
      background: currentColor;
      transition: width 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    @media (hover: hover) {
      .contact-linkedin:hover::after { width: 100%; }
    }

    .contact-email-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: #000;
      cursor: pointer;
      overflow: visible;
      position: relative;
    }

    .contact-email-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 3px;
      background: currentColor;
      transition: width 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    @media (hover: hover) {
      .contact-email-btn:hover::after { width: 100%; }
    }

    .contact-right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: clamp(8px, 1.5vw, 16px);
    }

    #footer-logo {
      width: clamp(48px, 6vw, 88px);
      height: clamp(48px, 6vw, 88px);
      border-radius: 50%;
      background: #C5FF30;
      display: block;
      overflow: hidden;
      text-decoration: none;
    }

    .contact-legal {
      font-size: clamp(10px, 0.9vw, 13px);
      color: rgba(0,0,0,0.4);
      text-align: right;
      line-height: 1.6;
      margin: 0;
    }

    @media (max-width: 768px) {
      #contact {
        flex-direction: column;
        align-items: flex-start;
      }
      .contact-right {
        width: 100%;
        align-items: flex-start;
      }
      .contact-legal { text-align: left; }
    }
  </style>
</head>
<body>

  <header id="site-header">
    <a href="/" id="logo-placeholder">
      <svg viewBox="0 0 100 100" width="100%" height="100%" overflow="visible" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <text x="50" y="50" text-anchor="middle" dominant-baseline="middle"
              font-family="DM Sans, sans-serif" font-weight="500" font-size="58" fill="#163F1A">a</text>
      </svg>
    </a>
    <h1 id="headline">Page<br>Not Found</h1>
  </header>

  <main id="main">
    <p id="error-code">404</p>
    <p id="error-msg">Wrong turn.</p>
    <p id="error-sub">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" id="home-link">← Back to home</a>
  </main>

  <footer id="contact">
    <div class="contact-left">
      <p class="contact-tagline">
        Get in touch<br>
        via <a class="contact-linkedin" href="https://www.linkedin.com/in/a-zdravkovic" target="_blank" rel="noopener">LinkedIn</a>
        or
        <button class="contact-email-btn" id="email-btn">e-mail</button>
      </p>
    </div>
    <div class="contact-right">
      <a href="/" id="footer-logo">
        <svg viewBox="0 0 100 100" width="100%" height="100%" overflow="visible" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="50" y="50" text-anchor="middle" dominant-baseline="middle"
                font-family="DM Sans, sans-serif" font-weight="500" font-size="58" fill="#163F1A">z</text>
        </svg>
      </a>
      <p class="contact-legal">© 2026 Aleksandar Zdravković. All rights reserved.<br>All trademarks and copyrighted materials belong to their respective owners.</p>
    </div>
  </footer>

  <script>
    const emailBtn = document.getElementById('email-btn');
    let copied = false;

    emailBtn.addEventListener('mouseenter', () => {
      if (!copied) { emailBtn.textContent = 'copy e-mail'; emailBtn.style.fontStyle = 'italic'; }
    });
    emailBtn.addEventListener('mouseleave', () => {
      if (!copied) { emailBtn.textContent = 'e-mail'; emailBtn.style.fontStyle = ''; }
    });
    emailBtn.addEventListener('click', () => {
      navigator.clipboard.writeText('dearmrzdravkovic@gmail.com').then(() => {
        copied = true;
        emailBtn.textContent = 'copied!';
        emailBtn.style.fontStyle = 'italic';
        setTimeout(() => {
          copied = false;
          emailBtn.textContent = 'e-mail';
          emailBtn.style.fontStyle = '';
        }, 2000);
      }).catch(() => {
        emailBtn.textContent = 'e-mail';
        emailBtn.style.fontStyle = '';
      });
    });
  </script>

</body>
</html>
