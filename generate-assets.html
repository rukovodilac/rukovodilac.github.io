<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Assets</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #111; color: #fff; display: flex; flex-direction: column; gap: 48px; }
    h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.5; }
    canvas { display: block; max-width: 100%; border: 1px solid #333; }
    button {
      margin-top: 12px;
      background: #E0EC8A; color: #000;
      border: none; padding: 10px 24px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #d4e07a; }
    .note { font-size: 12px; opacity: 0.4; margin-top: 8px; }
  </style>
</head>
<body>

  <div>
    <h2>Favicon — 512×512 PNG → save as favicon.png</h2>
    <canvas id="fav" width="512" height="512"></canvas>
    <button onclick="download('fav','favicon.png')">Download favicon.png</button>
    <p class="note">Place in repo root, then delete this file.</p>
  </div>

  <div>
    <h2>OG Share Image — 1200×630 PNG → save as og-image.png</h2>
    <canvas id="og" width="1200" height="630"></canvas>
    <button onclick="download('og','og-image.png')">Download og-image.png</button>
    <p class="note">Place in repo root, then delete this file.</p>
  </div>

  <script>
    function draw(id, w, h, fontSize, text) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#E0EC8A';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#000000';
      ctx.font = `700 ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, w / 2, h / 2);
    }

    draw('fav', 512, 512, 220, 'a–z');
    draw('og',  1200, 630, 260, 'a–z');

    function download(id, filename) {
      const canvas = document.getElementById(id);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
    }
  </script>

</body>
</html>
