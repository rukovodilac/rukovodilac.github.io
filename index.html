<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #000;
      overflow: hidden;
    }

    #rive-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: clamp(20px, 3vw, 40px);
      left: clamp(20px, 3.5vw, 48px);
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 500;
      line-height: 1;
      color: #3C1011;
      text-decoration: none;
      pointer-events: auto;
    }

    #headline {
      position: absolute;
      bottom: clamp(28px, 5vh, 72px);
      left: clamp(20px, 3.5vw, 48px);
    }

    #headline p {
      font-size: clamp(24px, 3.5vw, 52px);
      font-weight: 500;
      line-height: 1.25;
      color: #3C1011;
    }

    #headline span {
      background: #E0EC8A;
      padding: 2px 10px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
  </style>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <div id="overlay">
    <a href="/" id="logo">a–z</a>
    <div id="headline">
      <p><span>Interactive Motion Designer<br>for Games, Apps &amp; Web</span></p>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.23.10/rive.js"></script>
  <script>
    const canvas = document.getElementById('rive-canvas');
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    const isMobile = () => window.matchMedia('(pointer: coarse)').matches;

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      stateMachines: 'State Machine 1',
      autoplay: true,
      fit: rive.Fit.Cover,
      alignment: rive.Alignment.Center,
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        tick();
      },
      onLoadError: (e) => console.error('Rive error:', e)
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      r.resizeDrawingSurfaceToCanvas();
    });

    let targetSpeed = 0.3;
    let currentSpeed = 0.3;
    let mouseTimeout;

    function triggerSpeedUp() {
      targetSpeed = 1.0;
      clearTimeout(mouseTimeout);
      mouseTimeout = setTimeout(() => { targetSpeed = 0.3; }, 150);
    }

    document.addEventListener('mousemove', () => { if (!isMobile()) triggerSpeedUp(); });
    document.addEventListener('touchstart', () => { if (isMobile()) triggerSpeedUp(); });

    function tick() {
      const lerpFactor = currentSpeed < targetSpeed ? 0.12 : 0.04;
      currentSpeed += (targetSpeed - currentSpeed) * lerpFactor;
      r.playbackRate = currentSpeed;
      requestAnimationFrame(tick);
    }
  </script>

</body>
</html>
