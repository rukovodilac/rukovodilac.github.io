<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #F4E9D5;
      overflow: hidden;
    }

    #rive-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: clamp(20px, 3vw, 40px);
      left: clamp(20px, 3.5vw, 48px);
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 500;
      line-height: 1;
      color: #000;
      text-decoration: none;
      pointer-events: auto;
    }

    #headline {
      position: absolute;
      bottom: clamp(28px, 5vh, 72px);
      left: clamp(20px, 3.5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 0;
      pointer-events: auto;
      user-select: text;
    }

    #headline span {
      display: block;
      width: fit-content;
      background: #E0EC8A;
      padding: 2px 10px;
      font-size: clamp(24px, 3.5vw, 48px);
      font-weight: 500;
      line-height: 1;
      color: #000;
    }

    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="rive-canvas"></canvas>
  <canvas id="trail-canvas"></canvas>

  <div id="overlay">
    <a href="/" id="logo">a–z</a>
    <div id="headline">
      <span>Interactive Motion Designer</span>
      <span>for Games, Apps &amp; Web</span>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@latest/rive.js"></script>
  <script>
    // Rive animation
    const canvas = document.getElementById('rive-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      animations: 'Idle',
      autoplay: true,
      fit: rive.Fit.Cover,
      alignment: rive.Alignment.Center,
      onLoad: () => r.resizeDrawingSurfaceToCanvas(),
      onLoadError: (e) => console.error('Rive error:', e)
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      r.resizeDrawingSurfaceToCanvas();
      trailCanvas.width = window.innerWidth;
      trailCanvas.height = window.innerHeight;
    });

    // Mouse trail squares
    const trailCanvas = document.getElementById('trail-canvas');
    const tc = trailCanvas.getContext('2d');
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = window.innerHeight;

    const squares = [];
    let prevX = null, prevY = null;

    function spawnSquare(x, y) {
      const dx = prevX === null ? 999 : x - prevX;
      const dy = prevY === null ? 999 : y - prevY;
      if (dx * dx + dy * dy < 400) return;
      prevX = x; prevY = y;
      const size = 12 + Math.random() * 88;
      squares.push({
        x: x - size / 2 + (Math.random() - 0.5) * 30,
        y: y - size / 2 + (Math.random() - 0.5) * 30,
        s: size,
        born: performance.now(),
        life: 500 + Math.random() * 500
      });
    }

    window.addEventListener('mousemove', (e) => spawnSquare(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => spawnSquare(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    function drawTrail(now) {
      tc.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
      for (let i = squares.length - 1; i >= 0; i--) {
        const sq = squares[i];
        const t = (now - sq.born) / sq.life;
        if (t >= 1) { squares.splice(i, 1); continue; }
        tc.fillStyle = `rgba(255,255,255,${0.6 * (1 - t)})`;
        tc.fillRect(sq.x, sq.y, sq.s, sq.s);
      }
      requestAnimationFrame(drawTrail);
    }
    requestAnimationFrame(drawTrail);

  </script>

</body>
</html>
