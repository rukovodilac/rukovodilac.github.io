<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #000;
      overflow: hidden;
    }

    #rive-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: 40px;
      left: 48px;
      font-size: 96px;
      font-weight: 500;
      line-height: 1;
      color: #1c0e00;
      text-decoration: none;
      pointer-events: auto;
    }

    #headline {
      position: absolute;
      bottom: 72px;
      left: 48px;
      background: #c8d648;
      padding: 14px 18px;
    }

    #headline p {
      font-size: 52px;
      font-weight: 500;
      line-height: 1.2;
      color: #1c0e00;
    }
  </style>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <div id="overlay">
    <a href="/" id="logo">a–z</a>
    <div id="headline">
      <p>Interactive Motion Designer<br>for Games, Apps &amp; Web</p>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.23.10/rive.js"></script>
  <script>
    const canvas = document.getElementById('rive-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const isMobile = () => window.matchMedia('(pointer: coarse)').matches;

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      stateMachines: 'State Machine 1',
      autoplay: true,
      onLoad: () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        r.resizeDrawingSurfaceToCanvas();
        tick();
      },
      onLoadError: (e) => console.error('Rive error:', e)
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      r.resizeDrawingSurfaceToCanvas();
    });

    // --- Speed control ---
    let targetSpeed = 0.05;
    let currentSpeed = 0.05;
    let mouseTimeout;

    function triggerSpeedUp() {
      targetSpeed = 1.0;
      clearTimeout(mouseTimeout);
      mouseTimeout = setTimeout(() => { targetSpeed = 0.05; }, 150);
    }

    document.addEventListener('mousemove', () => { if (!isMobile()) triggerSpeedUp(); });
    document.addEventListener('touchstart', () => { if (isMobile()) triggerSpeedUp(); });

    function tick() {
      const lerpFactor = currentSpeed < targetSpeed ? 0.12 : 0.04;
      currentSpeed += (targetSpeed - currentSpeed) * lerpFactor;
      r.playbackRate = currentSpeed;
      requestAnimationFrame(tick);
    }
  </script>

</body>
</html>
