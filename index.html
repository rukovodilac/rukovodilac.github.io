<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Host Grotesk", sans-serif;
    }
  </style>
</head>
<body>
<!-- in <body> -->
<canvas id="rive-canvas"></canvas>

<!-- in <style> -->
<style>
  #rive-canvas {
    width: 100%;
    height: 100vh;
    display: block;
  }
</style>

<!-- before </body> -->
<script src="https://unpkg.com/@rive-app/webgl2@latest/rive.js"></script>
<script>
  const r = new rive.Rive({
    src: 'web_head_full.riv',
    canvas: document.getElementById('rive-canvas'),
    artboard: 'Web_Head',
    stateMachines: 'State Machine 1',
    autoplay: true,
    onLoad: () => {
      r.resizeDrawingSurfaceToCanvas();
      r.playbackRate = 0.05;
    }
  });

  let targetSpeed = 0.05;
  let currentSpeed = 0.05;
  let mouseTimeout;

  document.addEventListener('mousemove', () => {
    targetSpeed = 1.0;
    clearTimeout(mouseTimeout);
    mouseTimeout = setTimeout(() => {
      targetSpeed = 0.05; // start easing back after mouse stops
    }, 150);
  });

  function tick() {
    const lerpFactor = currentSpeed < targetSpeed ? 0.12 : 0.04;
    currentSpeed += (targetSpeed - currentSpeed) * lerpFactor;
    r.playbackRate = currentSpeed;
    requestAnimationFrame(tick);
  }

  tick();
</script>
</body>
</html>
