<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #000;
    }

    #rive-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <script src="https://unpkg.com/@rive-app/canvas@2.23.10/rive.js"></script>
  <script>
    const canvas = document.getElementById('rive-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      autoplay: true,
      onLoad: () => {
        console.log('animations:', r.animationNames);
        console.log('state machines:', r.stateMachineNames);
        r.resizeDrawingSurfaceToCanvas();
      },
      onLoadError: (e) => console.error('Rive error:', e)
    });
  </script>

</body>
</html>
