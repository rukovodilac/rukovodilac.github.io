<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #F4E9D5;
      overflow: hidden;
    }

    #rive-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: clamp(20px, 3vw, 40px);
      left: clamp(20px, 3.5vw, 48px);
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 500;
      line-height: 1;
      color: #3C1011;
      text-decoration: none;
      pointer-events: auto;
    }

    #headline {
      position: absolute;
      bottom: clamp(28px, 5vh, 72px);
      left: clamp(20px, 3.5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    #headline span {
      display: block;
      width: fit-content;
      background: #E0EC8A;
      padding: 2px 10px;
      font-size: clamp(24px, 3.5vw, 48px);
      font-weight: 500;
      line-height: 1;
      color: #3C1011;
    }
  </style>
</head>
<body>

  <canvas id="rive-canvas"></canvas>

  <div id="overlay">
    <a href="/" id="logo">a–z</a>
    <div id="headline">
      <span>Interactive Motion Designer</span>
      <span>for Games, Apps &amp; Web</span>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/canvas@2.23.10/rive.js"></script>
  <script>
    const canvas = document.getElementById('rive-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let inputs = {};

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      stateMachines: 'State Machine 1',
      autoplay: true,
      fit: rive.Fit.Cover,
      alignment: rive.Alignment.Center,
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        console.log('State machines:', r.stateMachineNames);
        console.log('Animations:', r.animationNames);
        const all = r.stateMachineInputs('State Machine 1');
        console.log('Inputs:', all?.map(i => i.name));
        all?.forEach(i => { inputs[i.name] = i; });
      },
      onLoadError: (e) => console.error('Rive error:', e)
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      r.resizeDrawingSurfaceToCanvas();
    });

    function setInput(name, value) {
      if (inputs[name] !== undefined) inputs[name].value = value;
    }

    document.addEventListener('mousemove', (e) => {
      setInput('mouseX', e.clientX / window.innerWidth);
      setInput('mouseY', e.clientY / window.innerHeight);
      setInput('x', e.clientX);
      setInput('y', e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      setInput('mouseX', t.clientX / window.innerWidth);
      setInput('mouseY', t.clientY / window.innerHeight);
      setInput('x', t.clientX);
      setInput('y', t.clientY);
    }, { passive: true });
  </script>

</body>
</html>
