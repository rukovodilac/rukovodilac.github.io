<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #F4E9D5;
    }

    /* ── HERO ── */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      #hero {
        height: min(100svh, calc(100vw * 1.5));
      }
      #headline {
        bottom: max(22%, 28px);
      }
    }

    #rive-canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #trail-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: clamp(20px, 3vw, 40px);
      left: clamp(20px, 3.5vw, 48px);
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 500;
      line-height: 1;
      color: #000;
      text-decoration: none;
      pointer-events: auto;
    }

    #headline {
      position: absolute;
      bottom: clamp(28px, 5vh, 72px);
      left: clamp(20px, 3.5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 0;
      pointer-events: auto;
      user-select: text;
    }

    #headline span {
      display: block;
      width: fit-content;
      background: #E0EC8A;
      padding: 2px 10px;
      font-size: clamp(24px, 3.5vw, 48px);
      font-weight: 500;
      line-height: 1;
      color: #000;
    }

    /* ── WORK SECTION ── */
    #work {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 768px) {
      #work {
        grid-template-columns: 1fr;
      }
    }

    .work-item {
      position: relative;
      display: block;
      overflow: hidden;
      text-decoration: none;
      color: #000;
      cursor: pointer;
      aspect-ratio: 16 / 9;
    }

    /* Video container */
    .work-media {
      position: absolute;
      inset: 0;
      background: #888;
      overflow: hidden;
    }

    .work-media video,
    .work-media iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: none;
      pointer-events: none;
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @media (hover: hover) {
      .work-item:hover .work-media video,
      .work-item:hover .work-media iframe {
        transform: scale(1.06);
      }
    }

    /* Tag badge (Latest, Rerun, etc.) */
    .work-tag {
      position: absolute;
      top: clamp(14px, 2vw, 24px);
      left: clamp(14px, 2vw, 24px);
      background: #E0EC8A;
      padding: 2px 10px;
      font-size: clamp(12px, 1.1vw, 16px);
      font-weight: 500;
      line-height: 1.4;
      color: #000;
      pointer-events: none;
    }

    /* Title block */
    .work-title {
      position: absolute;
      bottom: clamp(16px, 2.5vw, 32px);
      left: clamp(14px, 2vw, 24px);
      font-size: clamp(18px, 2.1vw, 34px);
      font-weight: 400;
      line-height: 1.2;
      color: #000;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Per-line highlight + underline draw animation */
    .work-title span {
      display: block;
      width: fit-content;
      background-color: #F4E9D5;
      background-image: linear-gradient(#000, #000);
      background-position: 0 100%;
      background-repeat: no-repeat;
      background-size: 0% 1.5px;
      padding: 2px 12px 4px;
      transition: background-size 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .work-title span:nth-child(2) {
      transition-delay: 0.07s;
    }

    @media (hover: hover) {
      .work-item:hover .work-title span {
        background-size: 100% 1.5px;
      }
    }

    /* Mobile: underline always visible */
    @media (hover: none) {
      .work-title span {
        background-size: 100% 1.5px;
      }
    }

    .arrow-icon {
      display: inline-block;
      width: 0.85em;
      height: 0.45em;
      vertical-align: 0.12em;
      margin-left: 0.25em;
      overflow: visible;
    }
  </style>
</head>
<body>

  <svg aria-hidden="true" focusable="false" style="display:none;position:absolute;width:0;height:0">
    <defs>
      <symbol id="arr" viewBox="0 0 20 9" overflow="visible">
        <line x1="0" y1="4.5" x2="14.5" y2="4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <polyline points="10,0 16,4.5 10,9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" vector-effect="non-scaling-stroke"/>
      </symbol>
    </defs>
  </svg>

  <section id="hero">
    <canvas id="trail-canvas"></canvas>
    <canvas id="rive-canvas"></canvas>

    <div id="overlay">
      <a href="/" id="logo">a–z</a>
      <div id="headline">
        <span>Interactive Motion Designer</span>
        <span>for Games, Apps &amp; Web</span>
      </div>
    </div>
  </section>

  <section id="work">

    <a href="#" class="work-item">
      <div class="work-media">
      </div>
      <div class="work-title">
        <span>Odd</span>
        <span>Mechanics <svg class="arrow-icon" aria-hidden="true"><use href="#arr"/></svg></span>
      </div>
    </a>

    <a href="#" class="work-item">
      <div class="work-media">
        <iframe
          src="https://player.cloudinary.com/embed/?cloud_name=dzar7cp0b&public_id=TetrisStory_Pre_pbezjz&autoplay=true&muted=true&loop=true&controls=false"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          frameborder="0"
        ></iframe>
      </div>
      <div class="work-tag">Latest</div>
      <div class="work-title">
        <span>Tetris Story</span>
        <span>Mobile Game <svg class="arrow-icon" aria-hidden="true"><use href="#arr"/></svg></span>
      </div>
    </a>

    <a href="#" class="work-item">
      <div class="work-media">
        <iframe
          src="https://player.cloudinary.com/embed/?cloud_name=dzar7cp0b&public_id=Tetris40_Pre_clttxf&autoplay=true&muted=true&loop=true&controls=false"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          frameborder="0"
        ></iframe>
      </div>
      <div class="work-title">
        <span>Tetris 40th</span>
        <span>Mobile Game <svg class="arrow-icon" aria-hidden="true"><use href="#arr"/></svg></span>
      </div>
    </a>

    <a href="#" class="work-item">
      <div class="work-media">
        <iframe
          src="https://player.cloudinary.com/embed/?cloud_name=dzar7cp0b&public_id=TheShow_Pre_lmjx2h&autoplay=true&muted=true&loop=true&controls=false"
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          allowfullscreen
          frameborder="0"
        ></iframe>
      </div>
      <div class="work-tag">Rerun</div>
      <div class="work-title">
        <span>The Show</span>
        <span>vol.1 <svg class="arrow-icon" aria-hidden="true"><use href="#arr"/></svg></span>
      </div>
    </a>

  </section>

  <script src="https://unpkg.com/@rive-app/canvas@latest/rive.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script>
    function heroH() {
      return Math.min(window.innerHeight, window.innerWidth * 1.5);
    }

    const canvas = document.getElementById('rive-canvas');
    canvas.width = window.innerWidth;
    canvas.height = heroH();

    const r = new rive.Rive({
      src: 'web_head_full.riv',
      canvas: canvas,
      animations: 'Idle',
      autoplay: true,
      fit: rive.Fit.Cover,
      alignment: rive.Alignment.Center,
      onLoad: () => r.resizeDrawingSurfaceToCanvas(),
      onLoadError: (e) => console.error('Rive error:', e)
    });

    const trailCanvas = document.getElementById('trail-canvas');
    const tc = trailCanvas.getContext('2d');
    trailCanvas.width = window.innerWidth;
    trailCanvas.height = heroH();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = heroH();
      r.resizeDrawingSurfaceToCanvas();
      trailCanvas.width = window.innerWidth;
      trailCanvas.height = heroH();
    });

    const squares = [];
    let prevX = null, prevY = null;

    function spawnSquare(x, y) {
      const dx = prevX === null ? 999 : x - prevX;
      const dy = prevY === null ? 999 : y - prevY;
      if (dx * dx + dy * dy < 400) return;
      prevX = x; prevY = y;
      const vmin = Math.min(window.innerWidth, window.innerHeight);
      const size = vmin * (0.015 + Math.random() * 0.08);
      squares.push({
        x: x - size / 2 + (Math.random() - 0.5) * 30,
        y: y - size / 2 + (Math.random() - 0.5) * 30,
        s: size,
        born: performance.now(),
        life: 2700 + Math.random() * 1800
      });
    }

    window.addEventListener('mousemove', (e) => spawnSquare(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => spawnSquare(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    // Lenis smooth scroll
    const lenis = new Lenis({
      duration: 1.4,
      easing: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)), // easeOutExpo
      smoothWheel: true,
    });

    function tick(now) {
      lenis.raf(now);
      tc.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
      for (let i = squares.length - 1; i >= 0; i--) {
        const sq = squares[i];
        const t = (now - sq.born) / sq.life;
        if (t >= 1) { squares.splice(i, 1); continue; }
        const opacity = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;
        tc.fillStyle = `rgba(255,255,255,${opacity})`;
        tc.fillRect(sq.x, sq.y, sq.s, sq.s);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>

</body>
</html>
