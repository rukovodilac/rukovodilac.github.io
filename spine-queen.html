<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d1a; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://unpkg.com/@esotericsoftware/spine-webgl@4.2.116/dist/iife/spine-webgl.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const context = new spine.ManagedWebGLRenderingContext(canvas);
    const renderer = new spine.SceneRenderer(canvas, context);
    const assets = new spine.AssetManager(context);

    assets.loadBinary('Queen.skel');
    assets.loadTextureAtlas('Queen.atlas');

    let skeleton, animState;
    const animations = ['Idle', 'Idle2'];
    let current = 0;

    function init() {
      try {
        const atlas = assets.get('Queen.atlas');
        console.log('atlas:', atlas);
        const loader = new spine.AtlasAttachmentLoader(atlas);
        const binary = new spine.SkeletonBinary(loader);
        binary.scale = 0.5;

        const skelData = assets.get('Queen.skel');
        console.log('skelData:', skelData);
        const data = binary.readSkeletonData(skelData);
        console.log('animations:', data.animations.map(a => a.name));

        skeleton = new spine.Skeleton(data);
        skeleton.setToSetupPose();
        skeleton.updateWorldTransform(spine.Physics.update);

        const stateData = new spine.AnimationStateData(data);
        stateData.defaultMix = 0.3;
        animState = new spine.AnimationState(stateData);
        animState.setAnimation(0, 'Idle', true);

        const offset = new spine.Vector2();
        const size = new spine.Vector2();
        skeleton.getBounds(offset, size, []);
        console.log('bounds offset:', offset, 'size:', size);

        renderer.camera.position.x = offset.x + size.x / 2;
        renderer.camera.position.y = offset.y + size.y / 2;
        renderer.camera.zoom = Math.max(size.x / canvas.width, size.y / canvas.height) * 1.2;
        renderer.camera.update();
      } catch(e) {
        console.error('init error:', e);
        document.body.innerHTML = '<pre style="color:red;padding:20px">' + e + '\n' + e.stack + '</pre>';
      }
    }

    // click to toggle animations
    canvas.addEventListener('click', () => {
      if (!animState) return;
      current = (current + 1) % animations.length;
      animState.setAnimation(0, animations[current], true);
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderer.camera.update();
    });

    let last = Date.now() / 1000;
    function render() {
      requestAnimationFrame(render);

      const now = Date.now() / 1000;
      const delta = Math.min(now - last, 0.1);
      last = now;

      const gl = context.gl;
      gl.clearColor(0.05, 0.05, 0.1, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      if (skeleton && animState) {
        animState.update(delta);
        animState.apply(skeleton);
        skeleton.updateWorldTransform(spine.Physics.update);

        renderer.begin();
        renderer.drawSkeleton(skeleton, true);
        renderer.end();
      }
    }

    function waitForLoad() {
      if (assets.isLoadingComplete()) {
        init();
        render();
      } else {
        requestAnimationFrame(waitForLoad);
      }
    }
    waitForLoad();
  </script>
</body>
</html>
