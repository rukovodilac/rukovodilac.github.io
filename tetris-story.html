<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris® Story — Aleksandar Zdravković</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Host Grotesk", sans-serif;
      background: #F4E9D5;
    }

    /* ── HEADER ── */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: clamp(20px, 3vw, 40px) clamp(20px, 3.5vw, 48px);
    }

    #logo {
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 500;
      line-height: 1;
      color: #000;
      text-decoration: none;
    }

    #tagline {
      text-align: right;
      font-size: clamp(14px, 1.4vw, 20px);
      font-weight: 500;
      line-height: 1.3;
      color: #000;
      padding-top: 0.2em;
    }

    #tagline span {
      display: block;
      width: fit-content;
      margin-left: auto;
      background: #E0EC8A;
      padding: 2px 10px;
    }

    /* ── PROJECT TITLE ── */
    #project-title {
      padding: 0 clamp(20px, 3.5vw, 48px) clamp(24px, 3vw, 40px);
    }

    #project-title h1 {
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 500;
      line-height: 1.1;
      color: #000;
    }

    #project-title h1 span {
      display: block;
      width: fit-content;
      background: #F4E9D5;
    }

    /* ── VIDEO ── */
    #video-wrap {
      padding: 0 clamp(20px, 3.5vw, 48px) clamp(48px, 7vw, 100px);
    }

    .vimeo-container {
      padding: 56.25% 0 0 0;
      position: relative;
    }

    .vimeo-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header id="header">
    <a href="/" id="logo">a–z</a>
    <div id="tagline">
      <span>Classic puzzle.</span>
      <span>Contemporary twist.</span>
    </div>
  </header>

  <div id="project-title">
    <h1>
      <span>Tetris® Story</span>
      <span>Mobile Game</span>
    </h1>
  </div>

  <div id="video-wrap">
    <div class="vimeo-container">
      <iframe src="https://player.vimeo.com/video/1190632857?title=0&amp;byline=0&amp;portrait=0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        title="TS_Reel">
      </iframe>
    </div>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
